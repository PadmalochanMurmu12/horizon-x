<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="goBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0043A8" />
      <stop offset="100%" stop-color="#002D7A" />
    </linearGradient>
    <linearGradient id="goGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Brand Canvas -->
  <rect width="160" height="160" rx="34" fill="url(#goBlue)" />
  
  <!-- Subtle Aviation Orbit Arc -->
  <path d="M 22 118 C 50 142, 110 142, 138 118" fill="none" stroke="url(#goGreen)" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />

  <!-- The Iconic Bold Lowercase "go" Wordmark -->
  <!-- "g" glyph -->
  <g fill="#FFFFFF">
    <!-- Letter g: Upper loop -->
    <path d="M 52 52 C 41 52, 33 60, 33 71 C 33 82, 41 90, 52 90 C 62 90, 69 82, 69 71 C 69 60, 62 52, 52 52 Z M 52 79 C 47 79, 44 75, 44 71 C 44 67, 47 63, 52 63 C 57 63, 60 67, 60 71 C 60 75, 57 79, 52 79 Z" />
    <!-- Letter g: Stem and Descender loop -->
    <path d="M 68 53 H 59 V 59 C 61 63, 62 67, 62 71 C 62 84, 53 90, 48 90 V 99 C 58 99, 69 94, 69 81 V 53 Z" opacity="0.95" />
    <path d="M 69 80 V 95 C 69 105, 59 110, 48 110 C 39 110, 32 107, 28 103 L 32 95 C 36 98, 41 101, 48 101 C 54 101, 60 98, 60 92 V 88 C 56 90, 51 90, 48 90 C 47 90, 46 90, 45 90 C 50 89, 62 82, 68 76 Z" />

    <!-- "o" glyph -->
    <path d="M 104 52 C 89 52, 79 64, 79 79 C 79 94, 89 106, 104 106 C 119 106, 129 94, 129 79 C 129 64, 119 52, 104 52 Z M 104 94 C 95 94, 89 87, 89 79 C 89 71, 95 64, 104 64 C 113 64, 119 71, 119 79 C 119 87, 113 94, 104 94 Z" />
  </g>

  <!-- Green Jet Contrail Dot -->
  <circle cx="127" cy="50" r="7" fill="url(#goGreen)" />
</svg>